# Render Blueprint for the Hair Xcellence backend (the website is deployed separately on Vercel).
# In Render: New + → Blueprint → pick this repository.
# The database is on Neon (free Postgres that doesn't expire): paste its connection link as DATABASE_URL.
services:
  - type: web
    name: hairxcellence-api
    runtime: python
    region: frankfurt  # closest Render region to Ghana; create the Neon database in Frankfurt too
    plan: free
    buildCommand: ./build.sh
    # 2 workers fit the free plan's memory; workers restart now and then to keep memory steady.
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 2 --timeout 60 --max-requests 1000 --max-requests-jitter 100 --access-logfile -
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "False"
      # 50+ random characters: python -c "import secrets; print(secrets.token_urlsafe(50))"
      # (Render's generated values are shorter than Django's security check requires.)
      - key: DJANGO_SECRET_KEY
        sync: false
      # Neon → your project → Connect → connection string (direct, not "pooled"), ends with ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Secrets: Render asks for these in the dashboard (never stored in git).
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Secret admin address, e.g. hx-studio-7f3k/ (the admin is then at https://<backend>/hx-studio-7f3k/)
      - key: DJANGO_ADMIN_URL
        sync: false
      - key: STORE_URL
        value: https://hair-xcellence.vercel.app
      # Set these in the Render dashboard once you know the URLs:
      - key: CORS_ALLOWED_ORIGINS
        value: https://hair-xcellence.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://hairxcellence-api.onrender.com
