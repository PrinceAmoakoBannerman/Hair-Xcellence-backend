# Render Blueprint for the Hair Xcellence backend (the website is deployed separately on Vercel).
# In Render: New + → Blueprint → pick this repository.
databases:
  - name: hairxcellence-db
    plan: free
    databaseName: hairxcellence
    user: hairxcellence

services:
  - type: web
    name: hairxcellence-api
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hairxcellence-db
          property: connectionString
      # Secrets: Render asks for these in the dashboard (never stored in git).
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STORE_URL
        value: https://hair-xcellence.vercel.app
      # Set these in the Render dashboard once you know the URLs:
      - key: CORS_ALLOWED_ORIGINS
        value: https://hair-xcellence.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://hairxcellence-api.onrender.com
